name: Build Check

on:
  # The Windows client under windows/ does not build the mac target, so
  # Windows-only commits should not spin up a macOS runner.
  # See docs/windows-port.md, milestone M0.
  push:
    paths-ignore:
      - 'windows/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'windows/**'
      - 'docs/**'
      - '**/*.md'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake libomp rust
      - name: Set up Ruby (for xcpretty)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Make run.sh executable
        run: chmod +x ./run.sh
      - name: Build with run.sh
        run: ./run.sh build 
